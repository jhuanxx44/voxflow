    // 初始化时应用设置
    applyDisplayMode(displayModeSelect.value);

    // 监听下拉框变化
    // 重置编辑函数（提前定义，便于在模式切换时使用）
    function resetEdit() {
      // 根据当前模式重置
      if (isCharEditMode) {
        charComposition = Array.from({ length: charLevelData.length }, (_, i) => i);
      } else {
        composition = Array.from({ length: lastSegments.length }, (_, i) => i);
      }
      hasEdited = true;

      // 重置智能分段的手动编辑标记
      isSmartParagraphManuallyEdited = false;
      smartParagraphGroups = [];

      renderResult(lastFullText, lastSegments);
    }

    displayModeSelect.addEventListener('change', () => {
      const mode = displayModeSelect.value;

      // 保存设置到localStorage
      localStorage.setItem('displayMode', mode);

      // 应用CSS样式
      applyDisplayMode(mode);

      // 切换显示模式时，自动触发重置编辑
      if (lastSegments.length > 0) {
        resetEdit();
      }
    });

    // 更新缓存信息显示
    function updateCacheInfo() {
      const stats = getCacheStats();
      if (stats.count > 0) {
        cacheInfoEl.textContent = `缓存: ${stats.count}个文件, ${stats.totalSizeKB}KB`;
      } else {
        cacheInfoEl.textContent = '';
      }
    }

    // 清除缓存按钮
    clearCacheBtn.addEventListener('click', () => {
      if (confirm('确定要清除所有ASR缓存吗？')) {
        const success = clearAllCache();
        if (success) {
          setStatus('缓存已清除', 1200);
          updateCacheInfo();
        } else {
          setStatus('清除缓存失败');
        }
      }
    });

    // 删除口癖功能
    const fillerTextInput = document.getElementById('fillerText');
    const deleteFillerBtn = document.getElementById('deleteFillerBtn');

    // 辅助函数：去除文本末尾的标点符号
    function removePunctuation(text) {
      if (!text) return '';
      // 移除常见的中英文标点符号
      return text.replace(/[。，、！？；：""''（）【】《》,.!?;:()\[\]<>]+$/g, '').trim();
    }

    deleteFillerBtn.addEventListener('click', () => {
      const fillerText = fillerTextInput.value.trim();

      if (!fillerText) {
        setStatus('请输入要删除的口癖文本', 2000);
        return;
      }

      if (!lastSegments || lastSegments.length === 0) {
        setStatus('没有可删除的文本', 2000);
        return;
      }

      // 停止播放
      if (editedPlaying) {
        stopEditedPlayback();
      }

      // 去除用户输入的标点符号，用于匹配
      const normalizedFillerText = removePunctuation(fillerText);

      // 根据当前模式查找匹配的segments
      let matchedIndices = [];
      if (isCharEditMode) {
        // 逐字编辑模式
        for (let i = 0; i < charComposition.length; i++) {
          const idx = charComposition[i];
          const char = charLevelData[idx];
          if (char && removePunctuation(char.char) === normalizedFillerText) {
            matchedIndices.push(i);
          }
        }
      } else {
        // 逐段编辑模式
        for (let i = 0; i < composition.length; i++) {
          const idx = composition[i];
          const seg = lastSegments[idx];
          if (seg && removePunctuation(seg.text) === normalizedFillerText) {
            matchedIndices.push(i);
          }
        }
      }

      if (matchedIndices.length === 0) {
        setStatus(`未找到匹配的文本"${fillerText}"`, 2000);
        return;
      }

      // 确认删除
      const confirmMsg = `找到 ${matchedIndices.length} 个匹配项，确定要删除吗？`;
      if (!confirm(confirmMsg)) {
        return;
      }

      // 批量删除（从后往前删除，避免索引变化）
      if (isCharEditMode) {
        for (let i = matchedIndices.length - 1; i >= 0; i--) {
          charComposition.splice(matchedIndices[i], 1);
        }
      } else {
        // 在智能分段模式下需要特殊处理
        if (getDisplayMode() === 'smart-paragraph') {
          isSmartParagraphManuallyEdited = true;

          // 从后往前删除，避免索引变化问题
          for (let i = matchedIndices.length - 1; i >= 0; i--) {
            const pos = matchedIndices[i];

            // 从composition中删除
            composition.splice(pos, 1);

            // 从段落分组中移除
            let newGroups = smartParagraphGroups.map(group => group.slice());
            for (let g = 0; g < newGroups.length; g++) {
              const idx = newGroups[g].indexOf(pos);
              if (idx !== -1) {
                newGroups[g].splice(idx, 1);
                break;
              }
            }

            // 更新后面所有索引（因为composition删除了一个元素）
            for (let g = 0; g < newGroups.length; g++) {
              for (let j = 0; j < newGroups[g].length; j++) {
                if (newGroups[g][j] > pos) {
                  newGroups[g][j]--;
                }
              }
            }

            // 移除空段落
            smartParagraphGroups = newGroups.filter(group => group.length > 0);
          }
        } else {
          // 其他模式直接删除
          for (let i = matchedIndices.length - 1; i >= 0; i--) {
            composition.splice(matchedIndices[i], 1);
          }
        }
      }

      hasEdited = true;
      renderResult(lastFullText, lastSegments);
      setStatus(`已删除 ${matchedIndices.length} 个匹配项`, 3000);

      // 清空输入框
      fillerTextInput.value = '';
    });

    // 页面加载时显示缓存信息
    updateCacheInfo();

    // 服务器状态监控
    async function updateServerStatus() {
      try {
        const resp = await fetch('/server-status');
        if (!resp.ok) {
          serverStatusEl.textContent = '🔴 服务器错误';
          return;
        }
        const data = await resp.json();

        // 构建状态文本
        let statusText = '';
        if (data.total_active === 0) {
          statusText = '🟢 服务器空闲';
        } else {
          const parts = [];
          if (data.basic.processing > 0) {
            parts.push(`基础模型处理中(${data.basic.processing})`);
          }
          if (data.basic.waiting > 0) {
            parts.push(`基础模型排队(${data.basic.waiting})`);
          }
          if (data.advanced.processing > 0) {
            parts.push(`高级模型处理中(${data.advanced.processing})`);
          }
          if (data.advanced.waiting > 0) {
            parts.push(`高级模型排队(${data.advanced.waiting})`);
          }
          statusText = '🟡 ' + parts.join(' | ');
        }

        serverStatusEl.textContent = statusText;
      } catch (e) {
        // 网络错误或服务器未启动
        serverStatusEl.textContent = '🔴 找不到服务器';
      }
    }

    // 初始更新并设置定时器（每2秒更新一次）
    updateServerStatus();
    setInterval(updateServerStatus, 2000);

    // --- 核心：编辑后播放逻辑 (修复版) ---
    // 统一高亮：依赖时间与句子范围，无编辑专用高亮

    function startEditedPlayback(fromPos = 0) {
      if (editedPlaying) stopEditedPlayback();
      if (!composition.length || isNaN(player.duration)) return;
      
      editedPlaying = true;
      editedPlayPos = fromPos;

      // 立即跳转到第一段开始
      const firstIdx = composition[editedPlayPos];
      const firstSeg = lastSegments[firstIdx];
      if (firstSeg) {
          player.currentTime = (firstSeg.start || 0) / 1000;
          highlightNow();
          player.play().catch(e => {
              console.error("Play error:", e);
              stopEditedPlayback();
          });
      }

      // 启动监控循环
      const monitor = () => {
        if (!editedPlaying) return;
        if (player.paused) {
            // 如果暂停了，不继续循环，等待 play 事件再次触发(或者由外部停止)
            // 这里为了防止 requestAnimationFrame 堆积，暂不自动重连
            return; 
        }

        const currentIdx = composition[editedPlayPos];
        const seg = lastSegments[currentIdx];
        
        if (!seg) {
            stopEditedPlayback();
            return;
        }

        const endTime = (seg.end || seg.start) / 1000;

        // 检查是否到达当前片段末尾
        // 增加 0.05s 的缓冲防止浮点数临界问题，或者严格判断
        if (player.currentTime >= endTime) {
            editedPlayPos++; // 准备下一段

            if (editedPlayPos >= composition.length) {
                // 播放结束
                player.pause();
                stopEditedPlayback();
                return;
            }

            // 获取下一段信息
            const nextIdx = composition[editedPlayPos];
            const nextSeg = lastSegments[nextIdx];
            const nextStart = (nextSeg.start || 0) / 1000;

            // 关键逻辑：判断是否连续
            // 如果下一段的开始时间 就在 当前播放位置附近 (误差 < 0.15s)
            // 则认为是连续音频，不需要 seek，直接让它播过去，避免卡顿
            if (Math.abs(player.currentTime - nextStart) > 0.15) {
                player.currentTime = nextStart;
            }
            
            highlightNow();
        }

        editedRAF = requestAnimationFrame(monitor);
      };

      editedRAF = requestAnimationFrame(monitor);
    }

    function stopEditedPlayback() {
      editedPlaying = false;
      if (editedRAF) { cancelAnimationFrame(editedRAF); editedRAF = null; }
    }


    // 重置编辑按钮（使用前面定义的resetEdit函数）
    const resetEditBtn = document.getElementById('resetEditBtn');
    resetEditBtn.onclick = () => {
      resetEdit();
    };

    // 右键菜单
    ctxMenu.delBtn.addEventListener('click', () => {
      ctxMenu.el.style.display = 'none';
      const pos = ctxMenu.targetPos;
      if (typeof pos !== 'number') return;

      // 停止当前播放，避免索引错位
      if (editedPlaying) {
        stopEditedPlayback();
      }

      // 根据当前模式删除
      if (isCharEditMode) {
        if (pos >= 0 && pos < charComposition.length) {
          charComposition.splice(pos, 1);
          hasEdited = true;
          renderResult(lastFullText, lastSegments);
        }
      } else {
        if (pos >= 0 && pos < composition.length) {
          composition.splice(pos, 1);
          hasEdited = true;

          // 在智能分段模式下，更新段落分组
          if (getDisplayMode() === 'smart-paragraph') {
            isSmartParagraphManuallyEdited = true;

            // 从段落分组中移除
            let newGroups = smartParagraphGroups.map(group => group.slice());
            for (let i = 0; i < newGroups.length; i++) {
              const idx = newGroups[i].indexOf(pos);
              if (idx !== -1) {
                newGroups[i].splice(idx, 1);
                break;
              }
            }

            // 更新后面所有索引（因为composition删除了一个元素）
            for (let i = 0; i < newGroups.length; i++) {
              for (let j = 0; j < newGroups[i].length; j++) {
                if (newGroups[i][j] > pos) {
                  newGroups[i][j]--;
                }
              }
            }

            // 移除空段落
            smartParagraphGroups = newGroups.filter(group => group.length > 0);
          }

          renderResult(lastFullText, lastSegments);
        }
      }
      ctxMenu.targetPos = null;
    });

    document.addEventListener('click', (e) => {
      if (ctxMenu.el.style.display === 'block' && !ctxMenu.el.contains(e.target)) {
        ctxMenu.el.style.display = 'none';
        ctxMenu.targetIdx = null;
      }
    });

    function getEditPlan() {
      return composition.map((i) => {
        const s = lastSegments[i];
        return {
          index: i,
          start: s && typeof s.start === 'number' ? s.start : 0,
          end: s && typeof s.end === 'number' ? s.end : 0,
          text: s && typeof s.text === 'string' ? s.text : '',
          spk: typeof s && typeof s.spk === 'number' ? s.spk : null
        };
      });
    }
    window.getEditPlan = getEditPlan;

    recognizeBtn.addEventListener('click', async () => {
      const file = fileInput.files && fileInput.files[0];

      // 检查是否选择了文件或素材
      if (!file && !currentMaterialName) {
        setStatus('请先选择音频文件或素材');
        return;
      }

      // 生成文件标识符（素材使用素材名，上传文件使用哈希）
      const fileId = currentMaterialName || getFileIdentifier(file);
      const adv = document.getElementById('advToggle').checked;
      const hotwords = document.getElementById('hotwords').value.trim();

      // 构建缓存key（包含配置信息）
      const cacheKey = `${fileId}_${adv ? 'adv' : 'basic'}_${hotwords || 'nohotwords'}`;

      // 先检查缓存
      const cached = getFromCache(cacheKey);
      if (cached && cached.result) {
        setStatus('<span class="loading-spinner"></span>从缓存加载<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>');
        try {
          const data = cached.result;
          try { lastDebugText = JSON.stringify(data, null, 2); } catch (e) { lastDebugText = String(data); }
          debugEl.textContent = lastDebugText;
          const { fullText, segments } = normalizeResult(data);
          lastFullText = fullText || '';
          lastSegments = Array.isArray(segments) ? segments : [];
          composition = Array.from({ length: lastSegments.length }, (_, i) => i);

          // 构建字级别数据
          charLevelData = buildCharLevelData(lastSegments);
          charComposition = Array.from({ length: charLevelData.length }, (_, i) => i);

          hasEdited = false;
          usedHotwords = data.hotwords_used || null;
          renderResult(lastFullText, lastSegments);
          setStatus('完成（使用缓存）', 1200);
          updateCacheInfo();
          recognizeBtn.classList.remove('highlight'); // 移除高亮
          return;
        } catch (err) {
          console.error('使用缓存失败，将重新识别:', err);
          // 缓存损坏，删除并继续识别
          removeFromCache(cacheKey);
        }
      }

      // 缓存不存在或失败，进行识别
      const endpoint = endpointInput.value.trim() || '/asr';
      setStatus('<span class="loading-spinner"></span>正在识别<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>');
      recognizeBtn.disabled = true;
      recognizeBtn.classList.remove('highlight'); // 开始识别时移除高亮

      // 立即更新服务器状态
      updateServerStatus();

      try {
        const fd = new FormData();

        // 如果是素材库文件，传递素材名称；否则上传文件
        if (currentMaterialName) {
          fd.append('material_name', currentMaterialName);
        } else {
          fd.append('audio', file);
        }

        fd.append('enable_advanced', adv ? 'true' : 'false');
        if (hotwords) {
          fd.append('hotwords', hotwords);
        }
        const resp = await fetch(endpoint, { method: 'POST', body: fd });
        const text = await resp.text();
        const headers = [];
        resp.headers.forEach((v, k) => headers.push(`${v ? v : ''}`));
        lastDebugText = `HTTP ${resp.status} ${resp.statusText}\n${headers.join('\n')}\n\n${text}`;
        debugEl.textContent = lastDebugText;
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
        }
        let data;
        try { data = JSON.parse(text); } catch { throw new Error('响应不可解析为JSON'); }

        // 保存到缓存
        const fileName = currentMaterialName || file.name;
        saveToCache(cacheKey, fileName, data);

        const { fullText, segments } = normalizeResult(data);
        lastFullText = fullText || '';
        lastSegments = Array.isArray(segments) ? segments : [];
        composition = Array.from({ length: lastSegments.length }, (_, i) => i);

        // 构建字级别数据
        charLevelData = buildCharLevelData(lastSegments);
        charComposition = Array.from({ length: charLevelData.length }, (_, i) => i);

        hasEdited = false;
        usedHotwords = data.hotwords_used || null;
        renderResult(lastFullText, lastSegments);
        setStatus('完成', 1200);
        updateCacheInfo();
      } catch (err) {
        setStatus(`错误：${err.message}`);
      } finally {
        recognizeBtn.disabled = false;
        // 识别完成后更新服务器状态
        updateServerStatus();
      }
    });

    function normalizeResult(data) {
      if (Array.isArray(data)) {
        const full = data[0] && typeof data[0].text === 'string' ? data[0].text : '';
        return { fullText: full, segments: data.slice(1) };
      }
      if (data && Array.isArray(data.segments)) {
        const full = typeof data.text === 'string' ? data.text : data.segments.map(s => s && s.text || '').join('');
        return { fullText: full, segments: data.segments };
      }
      const full = data && typeof data.text === 'string' ? data.text : '';
      const segs = data && Array.isArray(data) ? data : [];
      return { fullText: full, segments: segs };
    }

    function renderResult(fullText, segments) {
      if (highlightRAF) { cancelAnimationFrame(highlightRAF); highlightRAF = null; }
      resultTextEl.innerHTML = '';
      segmentsEl.innerHTML = '';
      sentenceSpans = [];

      // 显示热词信息
      if (usedHotwords) {
        hotwordsDisplayEl.innerHTML = `<span class="badge">使用的热词: ${usedHotwords}</span>`;
      } else {
        hotwordsDisplayEl.innerHTML = '';
      }

      if (!fullText && !segments.length) return;

      // 根据编辑模式选择渲染方式
      if (isCharEditMode) {
        renderCharLevel();
      } else {
        renderSegmentLevel(segments);
      }
    }

    // 智能分段：将多个segments组合成段落
    function groupSegmentsToParagraphs(list) {
      if (!list || list.length === 0) return [];

      const paragraphs = [];
      let currentParagraph = {
        segments: [],
        text: '',
        start: null,
        end: null,
        spk: null
      };

      const PAUSE_THRESHOLD = 5000; // 2秒停顿分段
      const MIN_PARAGRAPH_LENGTH = 20; // 最小段落长度（字符）
      const MAX_PARAGRAPH_LENGTH = 500; // 最大段落长度（字符）
      const IDEAL_SENTENCES = 15; // 理想句子数

      for (let i = 0; i < list.length; i++) {
        const seg = list[i];
        const prevSeg = i > 0 ? list[i - 1] : null;

        // 决定是否应该分段
        let shouldBreak = false;

        if (currentParagraph.segments.length > 0) {
          // 1. 说话人变化 - 分段
          if (typeof seg.spk === 'number' && typeof currentParagraph.spk === 'number' &&
              seg.spk !== currentParagraph.spk) {
            shouldBreak = true;
          }

          // 2. 时间间隔过长 - 分段
          if (prevSeg && seg.start && prevSeg.end) {
            const pause = seg.start - prevSeg.end;
            if (pause > PAUSE_THRESHOLD) {
              shouldBreak = true;
            }
          }

          // 3. 当前段落已达到理想句子数，且长度适中
          if (currentParagraph.segments.length >= IDEAL_SENTENCES &&
              currentParagraph.text.length >= MIN_PARAGRAPH_LENGTH) {
            shouldBreak = true;
          }

          // 4. 当前段落过长 - 强制分段
          if (currentParagraph.text.length + seg.text.length > MAX_PARAGRAPH_LENGTH) {
            shouldBreak = true;
          }
        }

        if (shouldBreak) {
          // 保存当前段落
          paragraphs.push({ ...currentParagraph });
          // 开始新段落
          currentParagraph = {
            segments: [seg],
            text: seg.text,
            start: seg.start,
            end: seg.end,
            spk: seg.spk
          };
        } else {
          // 添加到当前段落
          currentParagraph.segments.push(seg);
          currentParagraph.text += seg.text;
          if (currentParagraph.start === null) {
            currentParagraph.start = seg.start;
          }
          currentParagraph.end = seg.end;
          if (currentParagraph.spk === null) {
            currentParagraph.spk = seg.spk;
          }
        }
      }

      // 添加最后一个段落
      if (currentParagraph.segments.length > 0) {
        paragraphs.push(currentParagraph);
      }

      return paragraphs;
    }

    // 逐段编辑渲染
    function renderSegmentLevel(segments) {
      // 根据 composition 构建显示列表
      const list = composition.map(i => segments[i]).filter(Boolean);

      const displayMode = getDisplayMode();

      // 根据显示模式决定如何组织显示单元
      let displayUnits;
      if (displayMode === 'smart-paragraph') {
        // 智能分段模式
        if (isSmartParagraphManuallyEdited && smartParagraphGroups.length > 0) {
          // 用户已手动编辑，使用保存的段落分组
          displayUnits = smartParagraphGroups.map(group => {
            const segments = group.map(idx => list[idx]).filter(Boolean);
            if (segments.length === 0) return null;
            return {
              segments: segments,
              text: segments.map(s => s.text).join(''),
              start: segments[0].start,
              end: segments[segments.length - 1].end,
              spk: segments[0].spk
            };
          }).filter(Boolean);
        } else {
          // 首次应用智能分段规则
          displayUnits = groupSegmentsToParagraphs(list);

          // 保存段落分组结构（composition索引）
          let currentIndex = 0;
          smartParagraphGroups = displayUnits.map(unit => {
            const groupIndices = [];
            for (let i = 0; i < unit.segments.length; i++) {
              groupIndices.push(currentIndex++);
            }
            return groupIndices;
          });
        }
      } else if (displayMode === 'line-by-line') {
        // 逐句显示：每个segment独立显示
        displayUnits = list.map((seg, idx) => ({
          segments: [seg],
          text: seg.text,
          start: seg.start,
          end: seg.end,
          spk: seg.spk
        }));
      } else {
        // 连续显示：每个segment独立，但不分组
        displayUnits = list.map((seg, idx) => ({
          segments: [seg],
          text: seg.text,
          start: seg.start,
          end: seg.end,
          spk: seg.spk
        }));
      }

      // 1. 渲染文本区域
      displayUnits.forEach((unit, unitIndex) => {
        // 在智能分段模式下，创建段落容器
        const paragraphContainer = (displayMode === 'smart-paragraph') ? document.createElement('div') : null;
        if (paragraphContainer) {
          paragraphContainer.className = 'paragraph';
        }

        // 为段落中的每个句子创建span
        unit.segments.forEach((s, segIndex) => {
          // 计算renderIndex：在composition数组中的位置
          let renderIndex;
          if (displayMode === 'smart-paragraph') {
            // 智能分段模式：需要找到这个segment在composition中的索引
            if (isSmartParagraphManuallyEdited && smartParagraphGroups.length > 0) {
              // 手动编辑模式：从smartParagraphGroups中获取索引
              renderIndex = smartParagraphGroups[unitIndex][segIndex];
            } else {
              // 自动分段模式：通过list查找
              renderIndex = list.indexOf(s);
            }
          } else {
            // 其他模式：unitIndex就是renderIndex
            renderIndex = unitIndex;
          }

          if (renderIndex === -1 || renderIndex === undefined) return; // 安全检查

        const span = document.createElement('span');
        span.className = 'sentence';
        span.textContent = s.text;
        const start = s.start || 0;
        const end = s.end || start;
        span.dataset.start = start;
        span.dataset.end = end;
        // 存储原始索引以便查找
        const originalIdx = composition[renderIndex]; // 这就是 segments 里的 index
        span.dataset.idx = String(originalIdx);
        span.dataset.compIndex = String(renderIndex);
        
        if (typeof s.spk === 'number') {
          span.dataset.spk = String(s.spk);
          const color = SPEAKER_COLORS[Math.abs(s.spk) % SPEAKER_COLORS.length];
          span.style.setProperty('--hl', color);
        }
        span.title = `点击跳转 ${msToTime(start)}-${msToTime(end)}`;
        span.draggable = true;

        // 点击跳转逻辑
        span.addEventListener('click', () => {
          const posInComp = Number(span.dataset.compIndex);
          if (hasEdited && posInComp >= 0) {
            startEditedPlayback(posInComp);
            return;
          }
          if (!isNaN(player.duration)) {
            player.currentTime = start / 1000;
            player.play().catch(() => {});
          }
          highlightNow();
        });
        
        // 双击从此处开始编辑播放
        span.addEventListener('dblclick', () => {
           startEditedPlayback(renderIndex);
        });

        // 右键
        span.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          ctxMenu.targetPos = renderIndex;
          ctxMenu.el.style.left = `${e.clientX}px`;
          ctxMenu.el.style.top = `${e.clientY}px`;
          ctxMenu.el.style.display = 'block';
        });

        // 拖拽逻辑
        span.addEventListener('dragstart', () => { dragSrcIdx = renderIndex; }); // 记录当前渲染列表的索引
        
        span.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            span.classList.add('insert-after'); 
        });
        span.addEventListener('dragleave', () => { span.classList.remove('insert-after'); });
        span.addEventListener('drop', () => {
          span.classList.remove('insert-after');
          if (dragSrcIdx === null) return;
          const fromPos = dragSrcIdx;
          const toPos = renderIndex;
          if (fromPos === toPos) { dragSrcIdx = null; return; }

          // 停止当前播放，避免索引错位
          if (editedPlaying) {
            stopEditedPlayback();
          }

          const arr = composition.slice();
          const [moved] = arr.splice(fromPos, 1);
          const dstAfter = fromPos < toPos ? (toPos - 1) : toPos;
          const newPos = Math.min(dstAfter + 1, arr.length);
          arr.splice(newPos, 0, moved);
          composition = arr;
          hasEdited = true;

          // 在智能分段模式下，更新段落分组
          if (getDisplayMode() === 'smart-paragraph') {
            isSmartParagraphManuallyEdited = true;

            // 更新段落分组：移动元素
            let newGroups = smartParagraphGroups.map(group => group.slice());

            // 找到源位置所在的段落和位置
            let srcGroupIdx = -1, srcPosInGroup = -1;
            for (let i = 0; i < newGroups.length; i++) {
              const idx = newGroups[i].indexOf(fromPos);
              if (idx !== -1) {
                srcGroupIdx = i;
                srcPosInGroup = idx;
                break;
              }
            }

            // 找到目标位置所在的段落和位置
            let dstGroupIdx = -1, dstPosInGroup = -1;
            for (let i = 0; i < newGroups.length; i++) {
              const idx = newGroups[i].indexOf(toPos);
              if (idx !== -1) {
                dstGroupIdx = i;
                dstPosInGroup = idx;
                break;
              }
            }

            if (srcGroupIdx !== -1 && dstGroupIdx !== -1) {
              if (srcGroupIdx === dstGroupIdx) {
                // 同一段落内移动
                // 从源位置移除
                newGroups[srcGroupIdx].splice(srcPosInGroup, 1);

                // 计算插入位置（删除后索引可能变化）
                let insertPos;
                if (srcPosInGroup < dstPosInGroup) {
                  // 向后拖拽：因为删除了前面的元素，目标位置索引-1
                  insertPos = dstPosInGroup;
                } else {
                  // 向前拖拽：目标位置索引不变，插入到目标位置后面
                  insertPos = dstPosInGroup + 1;
                }

                newGroups[srcGroupIdx].splice(insertPos, 0, fromPos);

                // 段内移动不需要更新其他索引
              } else {
                // 跨段落移动
                // 从源段落移除
                newGroups[srcGroupIdx].splice(srcPosInGroup, 1);
                // 插入到目标段落（目标位置后面）
                newGroups[dstGroupIdx].splice(dstPosInGroup + 1, 0, fromPos);

                // 关键：更新所有段落中的索引，因为composition重新排列了
                // fromPos位置的元素移动到newPos
                for (let i = 0; i < newGroups.length; i++) {
                  for (let j = 0; j < newGroups[i].length; j++) {
                    const oldIdx = newGroups[i][j];
                    let newIdx = oldIdx;

                    if (oldIdx === fromPos) {
                      // 被移动的元素
                      newIdx = newPos;
                    } else if (fromPos < newPos) {
                      // 向后移动：fromPos+1 到 newPos 之间的元素左移
                      if (oldIdx > fromPos && oldIdx <= newPos) {
                        newIdx = oldIdx - 1;
                      }
                    } else {
                      // 向前移动：newPos 到 fromPos-1 之间的元素右移
                      if (oldIdx >= newPos && oldIdx < fromPos) {
                        newIdx = oldIdx + 1;
                      }
                    }

                    newGroups[i][j] = newIdx;
                  }
                }
              }

              // 移除空段落
              smartParagraphGroups = newGroups.filter(group => group.length > 0);
            }
          }

          dragSrcIdx = null;
          renderResult(lastFullText, lastSegments);
        });

        if (paragraphContainer) {
          paragraphContainer.appendChild(span);
        } else {
          resultTextEl.appendChild(span);
        }
        sentenceSpans.push(span); // 这里的 sentenceSpans 顺序与 composition 一致
        });

        // 在逐行模式下，将段落容器添加到结果区域
        if (paragraphContainer) {
          resultTextEl.appendChild(paragraphContainer);
        }
      });

      // 2. 渲染表格 (Segments List)
      list.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'segment';
        const g = document.createElement('div');
        g.className = 'grid';
        const textCell = document.createElement('div');
        textCell.textContent = s.text;
        const startCell = document.createElement('div');
        startCell.textContent = msToTime(s.start || 0);
        const endCell = document.createElement('div');
        endCell.textContent = msToTime(s.end || 0);
        const spkCell = document.createElement('div');
        spkCell.innerHTML = `<span class="chip">${typeof s.spk === 'number' ? s.spk : '-'}</span>`;
        const actionCell = document.createElement('div');
        const playBtn = document.createElement('button');
        playBtn.textContent = '播放片段';
        playBtn.addEventListener('click', () => {
          const posInComp = i;
          if (hasEdited && posInComp >= 0) {
            startEditedPlayback(posInComp);
            return;
          }
          const startMs = s.start || 0;
          const endMs = s.end || null;
          if (!isNaN(player.duration)) {
            player.currentTime = startMs / 1000;
            player.play();
            if (endMs) {
                const stopAt = endMs / 1000;
                const check = () => {
                    if (player.paused) return;
                    if (player.currentTime >= stopAt) {
                        player.pause();
                    } else {
                        requestAnimationFrame(check);
                    }
                };
                requestAnimationFrame(check);
            }
          }
        });
        actionCell.appendChild(playBtn);
        g.appendChild(textCell);
        g.appendChild(startCell);
        g.appendChild(endCell);
        g.appendChild(spkCell);
        g.appendChild(actionCell);
        row.appendChild(g);
        segmentsEl.appendChild(row);
      });
    }

    // 逐字编辑渲染
    function renderCharLevel() {
      const list = charComposition.map(i => charLevelData[i]).filter(Boolean);
      list.forEach((c, renderIndex) => {
        const span = document.createElement('span');
        span.className = 'sentence';  // 复用相同的样式
        span.textContent = c.char;
        const start = c.start || 0;
        const end = c.end || start;
        span.dataset.start = start;
        span.dataset.end = end;
        span.dataset.idx = String(renderIndex);  // 在charComposition中的索引
        span.dataset.compIndex = String(renderIndex);

        if (typeof c.spk === 'number') {
          span.dataset.spk = String(c.spk);
          const color = SPEAKER_COLORS[Math.abs(c.spk) % SPEAKER_COLORS.length];
          span.style.setProperty('--hl', color);
        }
        span.title = `点击跳转 ${msToTime(start)}-${msToTime(end)}`;
        span.draggable = true;

        // 点击跳转逻辑
        span.addEventListener('click', () => {
          const posInComp = Number(span.dataset.compIndex);
          if (hasEdited && posInComp >= 0) {
            startCharEditedPlayback(posInComp);
            return;
          }
          if (!isNaN(player.duration)) {
            player.currentTime = start / 1000;
            player.play().catch(() => {});
          }
          highlightNow();
        });

        // 双击从此处开始编辑播放
        span.addEventListener('dblclick', () => {
           startCharEditedPlayback(renderIndex);
        });

        // 右键
        span.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          ctxMenu.targetPos = renderIndex;
          ctxMenu.el.style.left = `${e.clientX}px`;
          ctxMenu.el.style.top = `${e.clientY}px`;
          ctxMenu.el.style.display = 'block';
        });

        // 拖拽逻辑
        span.addEventListener('dragstart', () => { dragSrcIdx = renderIndex; });

        span.addEventListener('dragover', (e) => {
            e.preventDefault();
            span.classList.add('insert-after');
        });
        span.addEventListener('dragleave', () => { span.classList.remove('insert-after'); });
        span.addEventListener('drop', () => {
          span.classList.remove('insert-after');
          if (dragSrcIdx === null) return;
          const fromPos = dragSrcIdx;
          const toPos = renderIndex;
          if (fromPos === toPos) { dragSrcIdx = null; return; }

          // 停止当前播放，避免索引错位
          if (editedPlaying) {
            stopEditedPlayback();
          }

          const arr = charComposition.slice();
          const [moved] = arr.splice(fromPos, 1);
          const dstAfter = fromPos < toPos ? (toPos - 1) : toPos;
          arr.splice(Math.min(dstAfter + 1, arr.length), 0, moved);
          charComposition = arr;
          hasEdited = true;
          dragSrcIdx = null;
          renderResult(lastFullText, lastSegments);
        });

        resultTextEl.appendChild(span);
        sentenceSpans.push(span);
      });
      renderSegmentsTable(lastSegments);
    }

    function renderSegmentsTable(segments) {
      const list = composition.map(i => segments[i]).filter(Boolean);
      list.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'segment';
        const g = document.createElement('div');
        g.className = 'grid';
        const textCell = document.createElement('div');
        textCell.textContent = s.text;
        const startCell = document.createElement('div');
        startCell.textContent = msToTime(s.start || 0);
        const endCell = document.createElement('div');
        endCell.textContent = msToTime(s.end || 0);
        const spkCell = document.createElement('div');
        spkCell.innerHTML = `<span class="chip">${typeof s.spk === 'number' ? s.spk : '-'}</span>`;
        const actionCell = document.createElement('div');
        const playBtn = document.createElement('button');
        playBtn.textContent = '播放片段';
        playBtn.addEventListener('click', () => {
          const posInComp = i;
          if (hasEdited && posInComp >= 0) {
            startEditedPlayback(posInComp);
            return;
          }
          const startMs = s.start || 0;
          const endMs = s.end || null;
          if (!isNaN(player.duration)) {
            player.currentTime = startMs / 1000;
            player.play();
            if (endMs) {
              const stopAt = endMs / 1000;
              const check = () => {
                if (player.paused) return;
                if (player.currentTime >= stopAt) {
                  player.pause();
                } else {
                  requestAnimationFrame(check);
                }
              };
              requestAnimationFrame(check);
            }
          }
        });
        actionCell.appendChild(playBtn);
        g.appendChild(textCell);
        g.appendChild(startCell);
        g.appendChild(endCell);
        g.appendChild(spkCell);
        g.appendChild(actionCell);
        row.appendChild(g);
        segmentsEl.appendChild(row);
      });
    }

    // 逐字编辑播放逻辑
    function startCharEditedPlayback(fromPos = 0) {
      if (editedPlaying) stopEditedPlayback();
      if (!charComposition.length || isNaN(player.duration)) return;

      editedPlaying = true;
      editedPlayPos = fromPos;

      // 立即跳转到第一个字开始
      const firstIdx = charComposition[editedPlayPos];
      const firstChar = charLevelData[firstIdx];
      if (firstChar) {
          player.currentTime = (firstChar.start || 0) / 1000;
          highlightNow();
          player.play().catch(e => {
              console.error("Play error:", e);
              stopEditedPlayback();
          });
      }

      // 启动监控循环
      const monitor = () => {
        if (!editedPlaying) return;
        if (player.paused) {
            return;
        }

        const currentIdx = charComposition[editedPlayPos];
        const charData = charLevelData[currentIdx];

        if (!charData) {
            stopEditedPlayback();
            return;
        }

        const endTime = (charData.end || charData.start) / 1000;

        // 检查是否到达当前字符末尾
        if (player.currentTime >= endTime) {
            editedPlayPos++;

            if (editedPlayPos >= charComposition.length) {
                // 播放结束
                player.pause();
                stopEditedPlayback();
                return;
            }

            // 获取下一个字信息
            const nextIdx = charComposition[editedPlayPos];
            const nextChar = charLevelData[nextIdx];
            const nextStart = (nextChar.start || 0) / 1000;

            // 判断是否连续
            if (Math.abs(player.currentTime - nextStart) > 0.15) {
                player.currentTime = nextStart;
            }

            highlightNow();
        }

        editedRAF = requestAnimationFrame(monitor);
      };

      editedRAF = requestAnimationFrame(monitor);
    }

    // ====== 素材库功能 ======

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      else if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      else return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    // 加载素材列表
    async function loadMaterials() {
      try {
        const resp = await fetch('/materials');
        const data = await resp.json();
        return data.materials || [];
      } catch (e) {
        console.error('加载素材列表失败:', e);
        return [];
      }
    }

    // 渲染素材列表（用户选择）
    async function renderMaterialsList() {
      materialsList.innerHTML = '加载中...';
      const materials = await loadMaterials();

      if (materials.length === 0) {
        materialsList.innerHTML = '<div style="text-align:center;color:#96a2b2;padding:20px;">素材库为空</div>';
        return;
      }

      materialsList.innerHTML = '';
      materials.forEach(mat => {
        const item = document.createElement('div');
        item.className = 'material-item';
        item.innerHTML = `
          <div class="material-info">
            <div class="material-name">${mat.name}</div>
            <div class="material-meta">${formatFileSize(mat.size)} • 上传于 ${mat.uploaded_at}</div>
          </div>
        `;
        item.addEventListener('click', () => selectMaterial(mat.name));
        materialsList.appendChild(item);
      });
    }

    // 渲染素材列表（管理员管理）
    async function renderAdminMaterialsList() {
      adminMaterialsList.innerHTML = '加载中...';
      const materials = await loadMaterials();

      if (materials.length === 0) {
        adminMaterialsList.innerHTML = '<div style="text-align:center;color:#96a2b2;padding:20px;">暂无素材</div>';
        return;
      }

      adminMaterialsList.innerHTML = '';
      materials.forEach(mat => {
        const item = document.createElement('div');
        item.className = 'material-item';
        item.innerHTML = `
          <div class="material-info">
            <div class="material-name">${mat.name}</div>
            <div class="material-meta">${formatFileSize(mat.size)} • ${mat.uploaded_at}</div>
          </div>
          <button onclick="deleteMaterial('${mat.name}')" style="margin-left:10px;">删除</button>
        `;
        adminMaterialsList.appendChild(item);
      });
    }

    // 选择素材
    async function selectMaterial(filename) {
      try {
        // 清理所有状态
        resetUI();

        // 清空文件上传输入框
        fileInput.value = '';

        // 清空热词输入框
        document.getElementById('hotwords').value = '';

        // 记录素材名称，不下载文件
        currentMaterialName = filename;

        // 加载音频到播放器（用于预览）
        if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
        currentFileUrl = `/materials/${encodeURIComponent(filename)}`;
        player.src = currentFileUrl;
        player.load();

        // 高亮识别按钮，引导用户点击
        recognizeBtn.classList.add('highlight');

        // 关闭模态框
        materialsModal.style.display = 'none';
        setStatus(`已选择素材: ${filename}`, 3000);
      } catch (e) {
        console.error('选择素材失败:', e);
        setStatus(`错误: ${e.message}`);
        alert(`选择素材失败: ${e.message}`);
      }
    }

    // 删除素材
    window.deleteMaterial = async function(filename) {
      const password = adminPassword.value.trim();
      if (!password) {
        alert('请先输入管理员密码');
        return;
      }

      if (!confirm(`确定要删除素材"${filename}"吗？`)) return;

      try {
        const resp = await fetch(`/admin/delete/${encodeURIComponent(filename)}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.error || '删除失败');
        }

        uploadStatus.textContent = '删除成功';
        setTimeout(() => uploadStatus.textContent = '', 2000);
        renderAdminMaterialsList();
      } catch (e) {
        uploadStatus.textContent = `错误: ${e.message}`;
      }
    };

    // 打开素材库
    materialsBtn.addEventListener('click', () => {
      materialsModal.style.display = 'block';
      renderMaterialsList();
    });

    // 打开管理界面
    adminBtn.addEventListener('click', () => {
      adminModal.style.display = 'block';
      renderAdminMaterialsList();
    });

    // 上传素材
    uploadBtn.addEventListener('click', async () => {
      const password = adminPassword.value.trim();
      const file = adminFile.files && adminFile.files[0];

      if (!password) {
        uploadStatus.textContent = '请输入管理员密码';
        return;
      }

      if (!file) {
        uploadStatus.textContent = '请选择文件';
        return;
      }

      try {
        uploadStatus.textContent = '上传中...';
        uploadBtn.disabled = true;

        const fd = new FormData();
        fd.append('password', password);
        fd.append('file', file);

        const resp = await fetch('/admin/upload', {
          method: 'POST',
          body: fd
        });

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.error || '上传失败');
        }

        uploadStatus.textContent = '上传成功！';
        adminFile.value = '';
        setTimeout(() => uploadStatus.textContent = '', 2000);
        renderAdminMaterialsList();
      } catch (e) {
        uploadStatus.textContent = `错误: ${e.message}`;
      } finally {
        uploadBtn.disabled = false;
      }
    });

    // 点击模态框外部关闭
    window.onclick = function(event) {
      if (event.target === materialsModal) {
        materialsModal.style.display = 'none';
      }
      if (event.target === adminModal) {
        adminModal.style.display = 'none';
      }
    };

    // ====== LLM 对话功能 ======
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');

    // 对话历史（保留最近5轮对话）
    const MAX_HISTORY_ROUNDS = 5;
    let chatHistory = [];

    // 截断对话历史，保留最近N轮
    function trimChatHistory() {
      const maxMessages = MAX_HISTORY_ROUNDS * 2; // 每轮包含user和assistant两条消息
      if (chatHistory.length > maxMessages) {
        chatHistory = chatHistory.slice(-maxMessages);
      }
    }

    // 自动调整输入框高度
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
    });

    // 回车发送（Shift+回车换行）
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendChatBtn.addEventListener('click', sendMessage);
    clearChatBtn.addEventListener('click', () => {
      chatHistory = [];
      chatMessages.innerHTML = '';
    });

    // 添加消息到界面
    function appendMessage(role, content, isReasoning = false) {
      const div = document.createElement('div');
      div.className = `chat-message ${role}${isReasoning ? ' reasoning' : ''}`;
      div.textContent = content;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    // 发送消息
    async function sendMessage() {
      const content = chatInput.value.trim();
      if (!content || sendChatBtn.classList.contains('sending')) return;

      // 添加用户消息
      appendMessage('user', content);
      chatHistory.push({ role: 'user', content });
      chatInput.value = '';
      chatInput.style.height = 'auto';

      // 禁用发送按钮
      sendChatBtn.classList.add('sending');
      sendChatBtn.textContent = '发送中...';

      // 创建助手消息占位
      const assistantDiv = appendMessage('assistant', '');
      let reasoningDiv = null;
      let assistantContent = '';
      let reasoningContent = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: chatHistory,
            stream: true
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                if (parsed.content) {
                  assistantContent += parsed.content;
                  assistantDiv.textContent = assistantContent;
                  chatMessages.scrollTop = chatMessages.scrollHeight;
                }
                if (parsed.reasoning) {
                  if (!reasoningDiv) {
                    reasoningDiv = appendMessage('assistant', '', true);
                  }
                  reasoningContent += parsed.reasoning;
                  reasoningDiv.textContent = reasoningContent;
                }
              } catch (e) {
                // 忽略解析错误
              }
            }
          }
        }

        // 保存助手回复到历史
        if (assistantContent) {
          chatHistory.push({ role: 'assistant', content: assistantContent });
          trimChatHistory(); // 截断历史，保留最近5轮
        }

      } catch (err) {
        assistantDiv.textContent = `错误: ${err.message}`;
        assistantDiv.style.color = '#ff6b6b';
      } finally {
        sendChatBtn.classList.remove('sending');
        sendChatBtn.textContent = '发送';
      }
    }
  </script>
