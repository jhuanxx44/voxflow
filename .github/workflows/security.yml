name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  repository-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Check tracked repository content
        run: python scripts/check_public_repo.py
      - name: Export all locked Python dependencies
        run: >-
          uv export --frozen --all-extras --no-emit-project --quiet
          --output-file /tmp/voxflow-requirements.txt
      - name: Audit Python dependencies
        run: >-
          uvx --python 3.11 --from pip-audit pip-audit
          --requirement /tmp/voxflow-requirements.txt
          --no-deps --disable-pip --vulnerability-service osv
          --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2026-139
      - name: Audit JavaScript runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
