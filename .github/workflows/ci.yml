name: VoxFlow V1

on:
  push:
  pull_request:

jobs:
  test-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Sync test dependencies
        run: uv sync --python 3.11 --extra dev --extra mcp --extra web --extra providers --extra tts
      - name: Python quality gate
        run: make check
      - name: Frontend quality gate
        run: npm ci && npm run build
      - name: Build wheel
        run: uv build --wheel
      - name: Fresh wheel install and end-to-end smoke
        shell: bash
        run: |
          python -m venv /tmp/voxflow-release-venv
          /tmp/voxflow-release-venv/bin/pip install \
            "voxflow[mcp] @ file://$GITHUB_WORKSPACE/dist/voxflow-1.0.0-py3-none-any.whl"
          cd /tmp
          PATH=/tmp/voxflow-release-venv/bin:$PATH python "$GITHUB_WORKSPACE/scripts/smoke_cli.py"
          /tmp/voxflow-release-venv/bin/voxflow --json \
            --home /tmp/voxflow-release-version version
          /tmp/voxflow-release-venv/bin/voxflow --json skill path
          /tmp/voxflow-release-venv/bin/voxflow --json skill install codex \
            --target-home /tmp/voxflow-release-codex
          /tmp/voxflow-release-venv/bin/voxflow --json skill check codex \
            --target-home /tmp/voxflow-release-codex
          /tmp/voxflow-release-venv/bin/voxflow --json skill install claude \
            --target-home /tmp/voxflow-release-claude
          /tmp/voxflow-release-venv/bin/voxflow --json skill check claude \
            --target-home /tmp/voxflow-release-claude

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install backend and frontend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          uv sync --python 3.11 --extra web --extra providers
          npm ci
          npx playwright install --with-deps chromium
      - name: Run deterministic browser regression
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
