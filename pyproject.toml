[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxflow"
version = "1.0.0"
description = "Deterministic headless audio/video editing engine with CLI and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
dependencies = [
  "filelock>=3.16,<4",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/jhuanxx44/voxflow"
Repository = "https://github.com/jhuanxx44/voxflow"
Issues = "https://github.com/jhuanxx44/voxflow/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.9,<3"]
web = ["flask==3.1.3", "flask-cors==6.0.1", "gunicorn>=24.1.1"]
asr-local = [
  "funasr==1.4.2",
  "librosa>=0.10.2",
  "modelscope>=1.32.0",
  "sentencepiece>=0.2.1",
  "soundfile>=0.12.1",
  "torch==2.10.0",
  "torchaudio==2.11.0",
]
providers = [
  "google-genai>=1.0.0",
  "openai==3.3.1",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
]
tts = ["requests>=2.32.0"]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
voxflow = "voxflow.interfaces.cli.main:app"

[tool.setuptools.packages.find]
include = ["voxflow*"]

[tool.setuptools.package-data]
voxflow = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["voxflow"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["funasr", "funasr.*"]
ignore_missing_imports = true
